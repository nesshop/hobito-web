<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F4EFE6"/>
    </linearGradient>
    <!-- Soft ambient orbs -->
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Pastel ambient glowing circles matching app screen -->
  <circle cx="200" cy="120" r="180" fill="#BAE6FD" opacity="0.5" filter="url(#blur)"/>
  <circle cx="1050" cy="500" r="220" fill="#FFD8B8" opacity="0.6" filter="url(#blur)"/>
  <circle cx="600" cy="300" r="150" fill="#FEF08A" opacity="0.35" filter="url(#blur)"/>

  <!-- Center Card -->
  <rect x="250" y="115" width="700" height="400" rx="36" fill="#FFFFFF" stroke="rgba(226, 232, 240, 0.8)" stroke-width="2" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.06))"/>

  <!-- Logo decorative bubbles -->
  <g transform="translate(510, 160)">
    <circle cx="30" cy="30" r="22" stroke="#20C997" stroke-width="3" fill="#FFFFFF"/>
    <path d="M30 20 V40 M20 30 H40" stroke="#20C997" stroke-width="3" stroke-linecap="round"/>

    <circle cx="90" cy="30" r="22" stroke="#FFA94D" stroke-width="3" fill="#FFFFFF"/>
    <path d="M80 34 C80 25 100 25 100 34 C100 40 85 41 85 43" stroke="#FFA94D" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <circle cx="150" cy="30" r="22" stroke="#38B6FF" stroke-width="3" fill="#FFFFFF"/>
    <rect x="142" y="22" width="16" height="16" rx="3" stroke="#38B6FF" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Title "Hobito" -->
  <text x="600" y="300" font-family="'Baloo 2', system-ui, sans-serif" font-size="82" font-weight="800" text-anchor="middle">
    <tspan fill="#FF6B6B">H</tspan>
    <tspan fill="#FFA94D">o</tspan>
    <tspan fill="#20C997">b</tspan>
    <tspan fill="#38B6FF">i</tspan>
    <tspan fill="#FFC038">t</tspan>
    <tspan fill="#5C7CFA">o</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="365" font-family="'Poppins', system-ui, sans-serif" font-size="24" font-weight="500" fill="#4A5568" text-anchor="middle">
    Tu diario de hobbies, logros y momentos especiales
  </text>

  <!-- Badges -->
  <g transform="translate(370, 410)">
    <rect x="0" y="0" width="140" height="40" rx="20" fill="#FFF1F2"/>
    <text x="70" y="26" font-family="'Poppins', sans-serif" font-size="14" font-weight="600" fill="#E11D48" text-anchor="middle">Seguimiento</text>

    <rect x="160" y="0" width="140" height="40" rx="20" fill="#FEF3C7"/>
    <text x="230" y="26" font-family="'Poppins', sans-serif" font-size="14" font-weight="600" fill="#D97706" text-anchor="middle">Logros &amp; XP</text>

    <rect x="320" y="0" width="140" height="40" rx="20" fill="#E0F2FE"/>
    <text x="390" y="26" font-family="'Poppins', sans-serif" font-size="14" font-weight="600" fill="#0284C7" text-anchor="middle">Comunidad</text>
  </g>
</svg>

